; TuneBot Guitar node (ESP32 #1) - DOIT ESP32 DevKit V1, ESP-IDF 5.x
; espressif32 6.x ships ESP-IDF 5.x. Leaving the version open pulls 7.x (ESP-IDF 6.x),
; which drops APIs the course code uses, so keep the pin.

[env:esp32doit-devkit-v1]
platform = espressif32 @ ^6.0.0
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
